# Plesk nginx include — paste into the "Additional nginx directives" field
# for the subdomain (e.g. invoicing.makrholdings.com).
#
# Replace APP_PORT with the tool's Flask port (5101, 5102, ...).
# SSL termination is handled by Plesk; this block only covers the proxy.

location / {
    proxy_pass         http://127.0.0.1:APP_PORT;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Increase timeouts for long-running tool operations
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}
