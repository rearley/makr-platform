[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makr-platform"
version = "0.2.0"
description = "MAKR Holdings Internal Tools Platform — shared starter kit for Flask tool apps"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pyjwt>=2.8",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["makr_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
